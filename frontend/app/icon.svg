<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0d0d"/>
      <stop offset="100%" stop-color="#08050a"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <g fill="#DC2626">
    <!-- Row 1: top bar -->
    <circle cx="9"  cy="9"  r="1.7"/>
    <circle cx="16" cy="9"  r="1.7"/>
    <circle cx="23" cy="9"  r="1.7"/>
    <!-- Row 2: thick top bar / mid -->
    <circle cx="9"  cy="14.5" r="1.7"/>
    <circle cx="16" cy="14.5" r="1.7"/>
    <circle cx="23" cy="14.5" r="1.7"/>
    <!-- Row 3: stem + middle bar -->
    <circle cx="9"  cy="20" r="1.7"/>
    <circle cx="16" cy="20" r="1.7"/>
    <!-- Row 4: stem only -->
    <circle cx="9"  cy="25.5" r="1.7"/>
  </g>
</svg>
