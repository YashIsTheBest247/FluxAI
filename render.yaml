# Render Blueprint — backend only. The Next.js frontend deploys to Vercel separately.
# Apply with: https://dashboard.render.com/ → New → Blueprint → connect this repo.

services:
  - type: web
    name: fragment-backend
    runtime: docker
    plan: free                # 512 MB RAM, 0.1 CPU, sleeps after 15 min idle, no persistent disk
    region: singapore         # closest free region to Bombay; swap for "oregon"/"frankfurt" if preferred
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Values committed here are safe to share. Secrets use sync:false and must
      # be filled in via the Render dashboard before the first deploy.
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: PROVIDER
        value: gemini
      - key: MOCK_MODE
        value: "false"
      - key: YOUTUBE_AUTO_UPLOAD
        value: "true"
      # Render's STORAGE_DIR is /tmp/storage; secrets go alongside it under
      # /tmp/secrets so the hydrate-from-env hook in main.py has a writable
      # target. (Defaults in config.py point at relative paths used for local dev.)
      - key: YOUTUBE_CLIENT_SECRETS
        value: /tmp/secrets/youtube_client_secret.json
      - key: YOUTUBE_TOKEN_FILE
        value: /tmp/secrets/youtube_token.json
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FLUX_CHANNEL_URL
        sync: false
      # Stock photo APIs — when set, tried BEFORE AI gen (faster, free, real photos).
      # Free signup: unsplash.com/developers, pexels.com/api
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      # Paste the FULL JSON contents of your local
      # secrets/youtube_client_secret.json and secrets/youtube_token.json here
      # via the Render dashboard. Multi-line is fine — Render accepts raw text.
      - key: YOUTUBE_CLIENT_SECRET_JSON
        sync: false
      - key: YOUTUBE_TOKEN_JSON
        sync: false
